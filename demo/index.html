<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命守护者</title>
<link rel="stylesheet" href="css/style.css?v=20260620a">
<style>
/* ========== CPR Flash animation keyframe (in HTML to avoid CSP issues) ========== */
@keyframes cprFlashAnim {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}
@keyframes aedDotBreathe {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.6); opacity: 1; }
}
</style>
</head>
<body>

<!-- ==============================
     主游戏容器
     ============================== -->
<div id="game">

  <!-- 全屏舞台（CSS占位背景） -->
  <section id="stage"></section>

  <!-- 媒体素材层 · 图片/视频（z-index:1, 在舞台之上、遮罩之下） -->
  <section id="mediaLayer"></section>

  <!-- 电影遮罩层（letterbox/晕影） -->
  <section id="cinematicOverlay"></section>

  <!-- 场景切换过渡遮罩 -->
  <div id="sceneTransition"></div>

  <!-- 消散粒子Canvas -->
  <canvas id="dissolveCanvas"></canvas>

  <!-- 黑幕间幕层：普通叙事逐字出现后淡出 -->
  <section id="intertitleLayer" aria-live="polite"></section>

  <!-- 雨效层 -->
  <section id="rainLayer"></section>

  <!-- HUD - 现场状态 -->
  <section id="hud"></section>

  <!-- ===== 电影式底部字幕带（统一narration+dialogue） ===== -->
  <section id="subtitleBar"></section>

  <!-- 选择层 -->
  <section id="choiceLayer"></section>

  <!-- 交互层 -->
  <section id="interactionLayer">

    <!-- CPR节奏模块 -->
    <div id="cprModule">
      <div class="cpr-hint">按压不断，胸廓回弹</div>
      <div class="cpr-bar-container">
        <div class="cpr-bar-fill" id="cprBarFill"></div>
        <div class="cpr-zone" id="cprTargetZone" style="left:35%;width:30%;"></div>
        <div class="cpr-beat-indicator" id="cprBeatBar" style="left:50%;"></div>
      </div>
      <div class="cpr-stats">
        <span>目标：100-120/min</span>
        <span>当前：<span class="cpr-rate" id="cprRateDisplay">--</span>/min</span>
        <span>质量：<span id="cprQualityDisplay">良好</span></span>
      </div>
      <div class="cpr-feedback good" id="cprFeedback"></div>
    </div>

    <!-- AED操作模块 -->
    <div id="aedModule">
      <div class="aed-step" id="aedStepText">AED已到场</div>
      <button class="aed-action-btn" id="aedActionBtn">操作</button>
      <div class="aed-status" id="aedStatus"></div>
    </div>

    <!-- 点名分工模块 -->
    <div id="assignModule">
      <div class="assign-card" data-witness="sun_jianguo">
        <div class="card-portrait">孙</div>
        <div class="card-name">灰西装先生</div>
        <div class="card-task">手机攥在手里，目光躲开</div>
      </div>
      <div class="assign-card" data-witness="ma_zhiguo">
        <div class="card-portrait">马</div>
        <div class="card-name">保安师傅</div>
        <div class="card-task">站在安检口方向，身体绷直</div>
      </div>
      <div class="assign-card" data-witness="lin_xiaoyu">
        <div class="card-portrait">林</div>
        <div class="card-name">白衬衫姑娘</div>
        <div class="card-task">攥着背包带，嘴唇发白</div>
      </div>
    </div>

    <!-- 换人交接模块 -->
    <div id="takeoverModule">
      <div class="takeover-hint">三、二、一，别让胸口停下</div>
      <div class="takeover-countdown" id="takeoverCountdown">3</div>
      <button class="takeover-btn" id="takeoverBtn">交接</button>
    </div>

  </section>

  <!-- 复盘层 -->
  <section id="reviewLayer"></section>

  <!-- 状态反馈 -->
  <section id="stateFeedback"></section>

  <!-- 场景标签 -->
  <div class="scene-label" id="sceneLabel" style="position:absolute;top:3vh;right:4vw;font-size:12px;color:rgba(143,152,163,0.4);letter-spacing:0.1em;z-index:15;"></div>

  <!-- 导航提示 -->
  <div id="navHint">继续</div>

  <!-- 浮动设置面板（ESC打开，小窗口悬浮） -->
  <section id="pauseMenu">
    <div class="float-panel-inner">
      <div class="float-panel-header">
        <span class="float-panel-title">设置</span>
        <button class="float-panel-close" id="pauseResume" title="关闭 (ESC)">✕</button>
      </div>
      <div class="float-panel-body">
      <!-- 音频 -->
      <div class="fp-section">
        <div class="fp-section-label">音频</div>
        <div class="fp-row">
          <label>主音量</label>
          <input type="range" id="fpMasterVol" min="0" max="100" value="80">
          <span class="fp-val" id="fpMasterVal">80%</span>
        </div>
        <div class="fp-row">
          <label>背景音乐</label>
          <input type="range" id="fpBgmVol" min="0" max="100" value="60">
          <span class="fp-val" id="fpBgmVal">60%</span>
        </div>
        <div class="fp-row">
          <label>环境音</label>
          <input type="range" id="fpAmbientVol" min="0" max="100" value="50">
          <span class="fp-val" id="fpAmbientVal">50%</span>
        </div>
        <div class="fp-row">
          <label>音效</label>
          <input type="range" id="fpSfxVol" min="0" max="100" value="80">
          <span class="fp-val" id="fpSfxVal">80%</span>
        </div>
        <div class="fp-row">
          <label>语音</label>
          <input type="range" id="fpVoiceVol" min="0" max="100" value="100">
          <span class="fp-val" id="fpVoiceVal">100%</span>
        </div>
      </div>
      <!-- 速度 -->
      <div class="fp-section">
        <div class="fp-section-label">播放速度</div>
        <div class="fp-row">
          <label>字幕/音频</label>
          <input type="range" id="fpSpeed" min="50" max="200" step="10" value="100">
          <span class="fp-val" id="fpSpeedVal">1.0x</span>
        </div>
      </div>
      <!-- 显示 -->
      <div class="fp-section">
        <div class="fp-section-label">显示</div>
        <div class="fp-row fp-toggle-row">
          <label>HUD状态栏</label>
          <button class="fp-toggle" id="fpHudToggle">显示中</button>
        </div>
      </div>
      <!-- 操作 -->
      <div class="fp-section fp-actions">
        <button class="fp-btn" id="pauseSave">保存进度</button>
        <button class="fp-btn" id="pauseRestart">返回主页</button>
      </div>
    </div>
    </div>
  </section>

  <!-- 开始画面 -->
  <section id="startScreen">
    <div class="start-bg"></div>
    <div id="startRain"></div>
    <div class="start-content">
      <img src="assets/images/game_logo.png" alt="圆心之外" class="game-logo">
      <div class="start-subtitle">互动版</div>
      <div class="start-buttons">
        <div class="start-hint">开始游戏</div>
        <div class="start-settings" id="startSettings">⚙ 设置</div>
        <div class="start-achievements" id="startAchievements">🏆 成就</div>
        <div class="start-leaderboard" id="startLeaderboard">📊 排行榜</div>
      </div>
      <div class="start-credits">AED急救模拟 · 电影式互动叙事</div>
    </div>
  </section>

  <!-- 音量控制界面（保留兼容，实际使用浮动面板） -->
  <section id="settingsPanel" class="settings-panel" style="display:none !important;">
    <div class="settings-content">
      <h2>音频设置</h2>
      <div class="settings-group">
        <label>主音量</label>
        <input type="range" id="masterVolume" min="0" max="100" value="80">
        <span id="masterVolumeValue">80%</span>
      </div>
      <div class="settings-group">
        <label>背景音乐</label>
        <input type="range" id="bgmVolume" min="0" max="100" value="60">
        <span id="bgmVolumeValue">60%</span>
      </div>
      <div class="settings-group">
        <label>环境音效</label>
        <input type="range" id="ambientVolume" min="0" max="100" value="50">
        <span id="ambientVolumeValue">50%</span>
      </div>
      <div class="settings-group">
        <label>游戏音效</label>
        <input type="range" id="sfxVolume" min="0" max="100" value="80">
        <span id="sfxVolumeValue">80%</span>
      </div>
      <button class="settings-close" id="settingsClose">返回</button>
    </div>
  </section>

  <!-- 排行榜界面 -->
  <section id="leaderboardPanel" class="leaderboard-panel">
    <div class="leaderboard-content">
      <h2>🏆 排行榜</h2>
      <div class="leaderboard-table">
        <div class="leaderboard-header">
          <span>排名</span>
          <span>玩家</span>
          <span>分数</span>
          <span>日期</span>
        </div>
        <div class="leaderboard-body" id="leaderboardBody">
          <!-- 排行榜数据将动态填充 -->
        </div>
      </div>
      <div class="leaderboard-actions">
        <button class="leaderboard-btn" id="leaderboardClear">清空记录</button>
        <button class="leaderboard-btn" id="leaderboardClose">返回</button>
      </div>
    </div>
  </section>

  <!-- 竖屏提示 -->
  <div id="mobileWarning">
    <div>建议横屏体验</div>
    <div style="font-size:12px;opacity:0.6;">最佳分辨率 1920×1080</div>
  </div>

  <!-- ==============================
       调试面板
       ============================== -->
  <div id="debugPanel">
    <div class="dbg-header">
      <span class="dbg-title">🔧 调试</span>
      <button class="dbg-toggle" id="dbgToggle" title="折叠/展开">−</button>
    </div>
    <div class="dbg-body" id="dbgBody">
      <div class="dbg-section">
        <label class="dbg-label">跳转场景</label>
        <select class="dbg-select" id="dbgSceneSelect">
          <option value="">-- 选择场景 --</option>
        </select>
      </div>
      <div class="dbg-section">
        <label class="dbg-label">当前场景</label>
        <div class="dbg-info" id="dbgCurrentScene">—</div>
      </div>
      <div class="dbg-section">
        <label class="dbg-label">状态变量</label>
        <div class="dbg-state" id="dbgStateVars"></div>
      </div>
      <div class="dbg-section dbg-actions">
        <button class="dbg-btn" id="dbgRestart">重新开始</button>
        <button class="dbg-btn" id="dbgToggleHud">HUD切换</button>
      </div>
    </div>
  </div>

</div>

<!-- ==============================
     JS 模块加载（按依赖顺序）
     ============================== -->
<script src="js/debug-log.js?v=3"></script>
<script src="js/state.js?v=20260620a"></script>
<script src="js/scenes.js?v=20260620a"></script>
<script src="js/audio.js?v=20260620a"></script>
<script src="js/achievements.js?v=20260620a"></script>
<script src="js/leaderboard.js?v=20260620a"></script>
<script src="js/interactions.js?v=20260620a"></script>
<script src="js/game.js?v=20260620a"></script>

<script>
// 初始化所有系统
document.addEventListener('DOMContentLoaded', () => {
  // 初始化成就和排行榜系统
  Achievements.init();
  Leaderboard.init();

  // 音量控制界面
  const settingsPanel = document.getElementById('settingsPanel');
  const startSettings = document.getElementById('startSettings');
  const settingsClose = document.getElementById('settingsClose');
  const startAchievements = document.getElementById('startAchievements');
  const startLeaderboard = document.getElementById('startLeaderboard');
  const leaderboardPanel = document.getElementById('leaderboardPanel');
  const leaderboardClose = document.getElementById('leaderboardClose');
  const leaderboardClear = document.getElementById('leaderboardClear');

  startSettings?.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();

    // 从开始画面打开浮动设置面板
    setTimeout(() => {
      Game._showFloatPanel(true); // true = 从开始画面打开（隐藏"返回主页"）
    }, 100);
  });

  settingsClose?.addEventListener('click', () => {
    settingsPanel?.classList.remove('active');
  });

  startAchievements?.addEventListener('click', (e) => {
    e.stopPropagation();
    Achievements.showStats();
  });

  startLeaderboard?.addEventListener('click', (e) => {
    e.stopPropagation();
    updateLeaderboardUI();
    leaderboardPanel?.classList.add('active');
  });

  leaderboardClose?.addEventListener('click', () => {
    leaderboardPanel?.classList.remove('active');
  });

  leaderboardClear?.addEventListener('click', () => {
    if (confirm('确定要清空所有记录吗？')) {
      Leaderboard.clearAll();
      updateLeaderboardUI();
    }
  });

  // 开始游戏按钮
  const startHint = document.querySelector('.start-hint');
  if (startHint) {
    startHint.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();

      // 确保浮动面板关闭（防止残留）
      Game._hideFloatPanel();

      // 隐藏首页
      const startScreen = document.getElementById('startScreen');
      if (startScreen) startScreen.style.display = 'none';

      // 检查是否有保存的进度
      const savedProgress = localStorage.getItem('aed_progress');
      if (savedProgress) {
        const progress = JSON.parse(savedProgress);
        if (confirm(`发现保存的进度（场景：${progress.currentScene}），是否继续？`)) {
          // 恢复进度
          Object.assign(GameState, progress.gameState);
          Game.goToScene(progress.currentScene);
        } else {
          // 清除保存的进度，重新开始
          localStorage.removeItem('aed_progress');
          Game.restartGame();
        }
      } else {
        // 没有保存的进度，重新开始
        GameState.init();
        Game._updateHUD();
        Game.goToScene('prologue_title');
      }

      // 启动背景音效（降低雨声音量）
      setTimeout(() => {
        AudioManager.startBackgroundAmbience(0.12);
      }, 500);
    });
  }

  // 浮动设置面板：音量/速度滑块绑定
  const fpSliders = {
    master:  { input: document.getElementById('fpMasterVol'),  val: document.getElementById('fpMasterVal')  },
    bgm:     { input: document.getElementById('fpBgmVol'),     val: document.getElementById('fpBgmVal')     },
    ambient: { input: document.getElementById('fpAmbientVol'), val: document.getElementById('fpAmbientVal') },
    sfx:     { input: document.getElementById('fpSfxVol'),     val: document.getElementById('fpSfxVal')     },
    voice:   { input: document.getElementById('fpVoiceVol'),   val: document.getElementById('fpVoiceVal')   },
  };

  Object.entries(fpSliders).forEach(([type, { input, val }]) => {
    if (!input) return;
    input.addEventListener('input', (e) => {
      const value = parseInt(e.target.value) / 100;
      AudioManager.setVolume(type, value);
      if (val) val.textContent = `${Math.round(value * 100)}%`;
      // 持久化
      Game._saveSetting(`vol_${type}`, value);
    });
  });

  // 速度滑块
  const fpSpeed = document.getElementById('fpSpeed');
  const fpSpeedVal = document.getElementById('fpSpeedVal');
  if (fpSpeed) {
    fpSpeed.addEventListener('input', (e) => {
      const speed = parseInt(e.target.value) / 100;
      Game.setTextSpeed(speed);
      if (fpSpeedVal) fpSpeedVal.textContent = `${speed.toFixed(1)}x`;
      Game._saveSetting('textSpeed', speed);
    });
  }

  // HUD开关
  const fpHudToggle = document.getElementById('fpHudToggle');
  if (fpHudToggle) {
    fpHudToggle.addEventListener('click', () => {
      Game.toggleHUD();
      fpHudToggle.textContent = Game.hudVisible ? '显示中' : '已隐藏';
      Game._saveSetting('hudVisible', Game.hudVisible);
    });
  }

  // 浮动面板内按钮
  document.getElementById('pauseSave')?.addEventListener('click', () => {
    Game._saveProgress();
    Game._showPauseMessage('进度已保存');
  });
  document.getElementById('pauseRestart')?.addEventListener('click', () => {
    Game._hideFloatPanel();
    Game._returnToMainMenu();
  });

  // 从localStorage恢复设置
  Game._loadSettings();

  // 开始画面背景点击（不处理，只通过开始游戏按钮触发）
});

function updateLeaderboardUI() {
  const body = document.getElementById('leaderboardBody');
  if (!body) return;

  const scores = Leaderboard.getTopScores();

  if (scores.length === 0) {
    body.innerHTML = '<div class="leaderboard-empty">暂无记录</div>';
    return;
  }

  body.innerHTML = scores.map((entry, index) => `
    <div class="leaderboard-row ${index < 3 ? 'top-' + (index + 1) : ''}">
      <span class="rank">${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : index + 1}</span>
      <span class="name">${entry.name}</span>
      <span class="score">${entry.score}</span>
      <span class="date">${entry.date}</span>
    </div>
  `).join('');
}
</script>

</body>
</html>
