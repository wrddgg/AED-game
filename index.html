<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命守护者 — 序幕 & 第一章</title>
<style>
/* ========== GLOBAL RESET & BASE ========== */
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#000;
  color:#fff;
  font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;
  overflow:hidden;
  width:100vw;height:100vh;
  user-select:none;
  -webkit-user-select:none;
}

/* ========== MAIN CANVAS ========== */
#screen{
  position:relative;
  width:100vw;height:100vh;
  overflow:hidden;
}

/* ---------- Image area ---------- */
.image-layer{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(90vw, 1600px);
  height:min(80vh, 900px);
  background:#0a0a0a;
  border:1px solid #1a1a1a;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity .8s;
}
.image-layer .placeholder{
  width:100%;height:100%;
  background:radial-gradient(ellipse at center, #1a1a1a 0%, #050505 70%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#2a2a2a;
  font-size:14px;
  letter-spacing:.2em;
}
.image-layer .placeholder .icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.image-layer .placeholder .label{opacity:.5;}

/* ========== NARRATOR PANEL - 左中，旁白累积 ========== */
.narrator-panel{
  position:absolute;
  left:6vw;
  top:50%;
  transform:translateY(-50%);
  width:42vw;
  max-width:700px;
  max-height:70vh;
  overflow-y:auto;
  z-index:10;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:20px 24px;
  /* 半透明背景 */
  background:rgba(0,0,0,.35);
  border-left:2px solid rgba(245,200,66,.25);
  border-radius:0 6px 6px 0;
  /* 隐藏滚动条 */
  scrollbar-width:none;
  -ms-overflow-style:none;
}
.narrator-panel::-webkit-scrollbar{display:none;}
.narrator-panel .subtitle-line{
  font-size:38px;
  line-height:1.5;
  letter-spacing:.08em;
  text-align:left;
  color:#d0d0d0;
  font-style:italic;
  min-height:auto;
  margin-bottom:2px;
  animation:lineFadeIn .4s ease-out;
}
@keyframes lineFadeIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.narrator-panel .subtitle-line .char{opacity:0;transition:opacity .035s;}
.narrator-panel .subtitle-line .char.show{opacity:1;}
.narrator-panel .subtitle-line .char.hl{
  color:#f5c842;
  font-weight:700;
  text-shadow:0 0 10px rgba(245,200,66,.5);
}

/* ========== SUBTITLE PANEL - 中底，字幕固定 ========== */
.subtitle-panel{
  position:absolute;
  bottom:6vh;
  left:50%;
  transform:translateX(-50%);
  width:min(80vw,1000px);
  z-index:10;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:20px 36px 24px;
  background:linear-gradient(transparent, rgba(0,0,0,.8) 35%);
  border-radius:4px;
  min-height:60px;
}
.subtitle-panel .subtitle-line{
  font-size:33px;
  line-height:1.6;
  letter-spacing:.05em;
  text-align:center;
  min-height:auto;
}
.subtitle-panel .subtitle-line .char{opacity:0;transition:opacity .04s;}
.subtitle-panel .subtitle-line .char.show{opacity:1;}
.subtitle-panel .subtitle-line .char.hl{
  color:#f5c842;
  font-weight:700;
  text-shadow:0 0 8px rgba(245,200,66,.5);
}

/* ---------- Speaker tag (in subtitle panel) ---------- */
.subtitle-panel .speaker-tag{
  display:inline-block;
  font-size:16px;
  color:#f5c842;
  border:1px solid rgba(245,200,66,.4);
  padding:3px 14px;
  border-radius:3px;
  margin-right:12px;
  letter-spacing:.12em;
  vertical-align:middle;
}

/* ---------- Note style (in subtitle panel) ---------- */
.subtitle-panel .note-line{
  font-size:18px;
  color:#777;
  font-style:italic;
  letter-spacing:.04em;
  text-align:center;
  margin-top:2px;
}
.subtitle-panel .note-line .char{opacity:0;transition:opacity .03s;}
.subtitle-panel .note-line .char.show{opacity:1;}
.subtitle-panel .note-line .char.hl{
  color:#f5c842;
  font-weight:700;
  text-shadow:0 0 6px rgba(245,200,66,.4);
}

/* ========== CHOICE OVERLAY ========== */
.choice-overlay{
  position:absolute;
  bottom:24vh;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  display:none;
  flex-direction:column;
  gap:14px;
  width:min(600px,85vw);
}
.choice-overlay.active{display:flex;}

.choice-btn{
  background:rgba(20,20,20,.92);
  border:1px solid rgba(255,255,255,.15);
  color:#ccc;
  padding:16px 24px;
  font-size:17px;
  cursor:pointer;
  text-align:left;
  letter-spacing:.04em;
  transition:all .25s;
  position:relative;
  font-family:inherit;
}
.choice-btn:hover{
  border-color:#f5c842;
  color:#fff;
  background:rgba(40,40,40,.95);
  padding-left:32px;
}
.choice-btn::before{
  content:"▸";
  position:absolute;
  left:14px;
  color:#f5c842;
  opacity:0;
  transition:all .25s;
}
.choice-btn:hover::before{opacity:1;}
.choice-btn .key-label{
  color:#f5c842;
  font-weight:700;
  margin-right:6px;
}

/* ========== SCENE LABEL ========== */
.scene-label{
  position:absolute;
  top:24px;left:60px;
  font-size:11px;
  letter-spacing:.25em;
  color:rgba(255,255,255,.25);
  z-index:15;
  text-transform:uppercase;
}

/* ========== PROGRESS BAR ========== */
.progress-bar{
  position:absolute;
  bottom:0;left:0;height:2px;
  background:#f5c842;
  z-index:30;
  transition:width .3s;
}

/* ========== NAVIGATION HINT ========== */
.nav-hint{
  position:absolute;
  bottom:30px;right:60px;
  font-size:12px;
  color:rgba(255,255,255,.25);
  letter-spacing:.1em;
  z-index:15;
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:.2;}50%{opacity:.5;}}

/* ========== SCENE TRANSITIONS ========== */
.fade-out{animation:fadeOut .6s forwards;}
.fade-in{animation:fadeIn .6s forwards;}
@keyframes fadeOut{to{opacity:0;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ========== RAIN EFFECT (for rain scenes) ========== */
.rain-container{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:5;overflow:hidden;
}
.rain-drop{
  position:absolute;
  width:1px;height:20px;
  background:linear-gradient(transparent,rgba(180,200,220,.6));
  animation:rainFall linear infinite;
}
@keyframes rainFall{
  0%{transform:translateY(-120px);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(105vh);opacity:0;}
}

/* ========== CAMERA SHAKE ========== */
.shake{animation:shake .3s ease-in-out;}
@keyframes shake{
  0%,100%{transform:translate(-50%,-50%);}
  25%{transform:translate(calc(-50% + 4px), calc(-50% - 3px));}
  50%{transform:translate(calc(-50% - 3px), calc(-50% + 2px));}
  75%{transform:translate(calc(-50% + 2px), calc(-50% + 4px));}
}

/* ========== VIGNETTE (tunnel vision) ========== */
.vignette{
  position:absolute;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:8;
  box-shadow:inset 0 0 180px 60px rgba(0,0,0,.8);
  border-radius:0;
}

/* ========== CPR FLASH ========== */
.cpr-flash{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:rgba(255,255,255,.04);
  pointer-events:none;z-index:6;
  animation:cprPulse .6s infinite;
}
@keyframes cprPulse{0%,100%{opacity:0;}50%{opacity:1;}}

/* ========== YELLOW DOT PULSE ========== */
.breathing-dot{
  width:20px;height:20px;
  background:#f5c842;
  border-radius:50%;
  position:absolute;
  box-shadow:0 0 30px #f5c842, 0 0 60px rgba(245,200,66,.4);
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:.8;}
  50%{transform:scale(1.8);opacity:1;}
}

/* ========== RESPONSIVE ========== */
@media(max-width:768px){
  .narrator-panel{
    left:3vw;width:48vw;
    padding:12px 14px;
    max-height:55vh;
  }
  .narrator-panel .subtitle-line{font-size:22px;}
  .subtitle-panel{
    width:90vw;
    padding:14px 20px 18px;
  }
  .subtitle-panel .subtitle-line{font-size:20px;}
  .subtitle-panel .speaker-tag{font-size:12px;padding:2px 8px;}
  .subtitle-panel .note-line{font-size:14px;}
  .choice-overlay{bottom:20vh;}
  .choice-btn{font-size:15px;padding:14px 18px;}
  .scene-label{top:12px;left:20px;font-size:10px;}
  .nav-hint{bottom:70px;right:20px;}
}
</style>
</head>
<body>

<div id="screen">
  <!-- Image Layer -->
  <div class="image-layer" id="imageLayer">
    <div class="placeholder" id="placeholder">
      <div class="icon">🎬</div>
      <div class="label">生命守护者</div>
    </div>
  </div>

  <!-- Rain Container (hidden by default) -->
  <div class="rain-container" id="rainContainer" style="display:none;"></div>

  <!-- Narrator Panel - 左中，旁白累积 -->
  <div class="narrator-panel" id="narratorPanel"></div>

  <!-- Subtitle Panel - 中底，字幕固定 -->
  <div class="subtitle-panel" id="subtitlePanel"></div>

  <!-- Choice Overlay -->
  <div class="choice-overlay" id="choiceOverlay"></div>

  <!-- Scene Label -->
  <div class="scene-label" id="sceneLabel"></div>

  <!-- Nav Hint -->
  <div class="nav-hint" id="navHint">点击或按空格继续 ▸</div>

  <!-- Progress -->
  <div class="progress-bar" id="progressBar" style="width:0%;"></div>
</div>

<script>
// ==================== DATA: ALL SCENES ====================
const scenes = [

{

    {text:"那个人的脸，他到现在还记得。",hl:["到现在还记得"]},
    {text:"保安拦着他说：",hl:["保安拦着"]},
    {text:"「小伙子别逞能，进去了连你也出不来！」",hl:["进去了连你也出不来"]},
    {text:"他听了劝，退回去了。",hl:["退回去了"]},

    {text:"这件事他从没对任何人提起，",hl:["从没对任何人提起"]},

{

    {text:"来临江三年，送外卖是第7份工作。",hl:["第7份工作"]},
    {text:"但他没换掉一个习惯——",hl:["没换掉一个习惯"]},
    {text:"每次路过医院，他都会多看一眼急诊科的灯。",hl:["多看一眼急诊科的灯"]},

  rain:true,
  lines:[
    {text:"今天，他只是一个想把最后一份外卖准时送到、",hl:["准时送到"]},
    {text:"不被扣钱的普通人。",hl:["普通人"]},
    {text:"但城市给每个人的剧本，有时候不止一份。",hl:["不止一份"]}

{

// ========== 分支A · 挤进人群 ==========

// ==================== TYPING ENGINE ====================
// target: "narrator" | "subtitle" — which panel to type into
function typeLine(line, callback, target){
  target = target || "subtitle";
  return new Promise(resolve => {
    const text = line.text;
    const hlWords = line.hl || [];
    const container = document.createElement("div");
    container.className = "subtitle-line";
    
    if(target === "narrator"){
      narratorPanel.appendChild(container);
      // Auto-scroll to bottom for accumulating narration
      narratorPanel.scrollTop = narratorPanel.scrollHeight;
    } else {
      subtitlePanel.appendChild(container);
    }
    
    // Build spans for each character
    const spans = [];
    for(let i = 0; i < text.length; i++){
      const span = document.createElement("span");
      span.className = "char";
      span.textContent = text[i];
      container.appendChild(span);
      spans.push({el:span, char:text[i], index:i});
    }
    
    // Determine highlight ranges
    const hlRanges = [];
    hlWords.forEach(word => {
      let idx = text.indexOf(word);
      while(idx !== -1){
        hlRanges.push({start:idx, end:idx + word.length});
        idx = text.indexOf(word, idx + 1);
      }
    });
    
    function isInHl(idx){
      for(let r of hlRanges){
        if(idx >= r.start && idx < r.end) return true;
      }
      return false;
    }
    
    // Reveal characters sequentially
    let charIdx = 0;
    function revealNext(){
      if(charIdx >= spans.length){
        if(callback) callback();
        resolve();
        return;
      }
      const s = spans[charIdx];
      if(isInHl(s.index)){
        s.el.classList.add("hl");
      }
      s.el.classList.add("show");
      charIdx++;
      typingTimer = setTimeout(revealNext, 50);
    }
    revealNext();
  });
}

// ==================== SPEAKER TAG ====================
function addSpeakerTag(name){
  const tag = document.createElement("span");
  tag.className = "speaker-tag";
  tag.textContent = name;
  const line = document.createElement("div");
  line.className = "subtitle-line";
  line.style.textAlign = "left";
  line.style.paddingLeft = "20px";
  line.appendChild(tag);
  subtitlePanel.appendChild(line);
  return line;
}

  }
  
  for(let i = 0; i < text.length; i++){
    await new Promise(r => { typingTimer = setTimeout(r, 35); });
    const s = spans[i];
    if(isInHl(s.index)) s.el.classList.add("hl");
    s.el.classList.add("show");
  }
}

// ==================== SCENE RENDERER ====================
async function renderScene(scene){
  if(typingTimer) clearTimeout(typingTimer);
  isTyping = true;
  
  // Clear states
  clearAllText();
  clearChoices();
  removeCprFlash();
  removeVignette();
  removeAedDot();
  navHint.style.display = "none";
  
  // Scene label
  sceneLabel.textContent = scene.label || "";
  
  // Image placeholder
  placeholder.querySelector(".label").textContent = scene.imageLabel || "场景画面";
  
  // Rain
  if(scene.rain) startRain();
  else stopRain();
  
  // CPR flash
  if(scene.cprFlash) showCprFlash();
  
  // Vignette
  if(scene.vignette) showVignette();
  
  // AED map dot
  if(scene.aedMap) showAedDot();
  
  // === Render main lines ===
  if(scene.lines){
    if(scene.type === "narration"){
      // 旁白 → 左中面板，累积不消除
      for(let i = 0; i < scene.lines.length; i++){
        await typeLine(scene.lines[i], null, "narrator");
        narratorPanel.scrollTop = narratorPanel.scrollHeight;
      }
    } else if(scene.type === "dialogue"){
      // 对话 → 中底字幕面板
      for(let i = 0; i < scene.lines.length; i++){
        const line = scene.lines[i];
        if(i === 0){
          // 首行加发言人标签
          clearSubtitles();
          addSpeakerTag(scene.speaker);
        }
        await typeLine(line, null, "subtitle");
      }
    }
  }
  
  // === Extra dialogue blocks (go to subtitle panel) ===
  if(scene.next_dialogue){
    await new Promise(r => setTimeout(r, 600));
    clearSubtitles();
    addSpeakerTag(scene.next_dialogue.speaker);
    await typeLine({text:scene.next_dialogue.text, hl:scene.next_dialogue.hl}, null, "subtitle");
    if(scene.next_dialogue.note){
      await new Promise(r => setTimeout(r, 400));
      await showNote(scene.next_dialogue.note, []);
    }
  }
  
  if(scene.next_dialogue2){
    await new Promise(r => setTimeout(r, 600));
    clearSubtitles();
    addSpeakerTag(scene.next_dialogue2.speaker);
    await typeLine({text:scene.next_dialogue2.text, hl:scene.next_dialogue2.hl}, null, "subtitle");
    if(scene.next_dialogue2.note){
      await new Promise(r => setTimeout(r, 400));
      await showNote(scene.next_dialogue2.note, []);
    }
  }
  
  // === Extra narration blocks (go to narrator panel, accumulate) ===
  if(scene.next_narration){
    await new Promise(r => setTimeout(r, 600));
    await typeLine({text:scene.next_narration.text, hl:scene.next_narration.hl||[]}, null, "narrator");
    narratorPanel.scrollTop = narratorPanel.scrollHeight;
  }
  
  if(scene.next_narration2){
    await new Promise(r => setTimeout(r, 500));
    await typeLine({text:scene.next_narration2.text, hl:scene.next_narration2.hl||[]}, null, "narrator");
    narratorPanel.scrollTop = narratorPanel.scrollHeight;
  }
  
  if(scene.next_narration3){
    await new Promise(r => setTimeout(r, 500));
    await typeLine({text:scene.next_narration3.text, hl:scene.next_narration3.hl||[]}, null, "narrator");
    narratorPanel.scrollTop = narratorPanel.scrollHeight;
  }
  
  // Choice
  if(scene.choice){
    await new Promise(r => setTimeout(r, 800));
    showChoices(scene.choice);
  }
  
  // Auto-advance if no choice
  if(!scene.choice){
    await new Promise(r => setTimeout(r, 1200));
    navHint.style.display = "block";
  }
  
  isTyping = false;
}

// ==================== CHOICES ====================
function showChoices(choiceData){
  choiceOverlay.innerHTML = "";
  
  const prompt = document.createElement("div");
  prompt.style.cssText = "text-align:center;color:#f5c842;font-size:16px;letter-spacing:.06em;margin-bottom:8px;";
  prompt.textContent = choiceData.prompt;
  choiceOverlay.appendChild(prompt);
  
  choiceData.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.innerHTML = `<span class="key-label">${opt.key}.</span> ${opt.label}`;
    btn.addEventListener("click", () => navigateTo(opt.next));
    choiceOverlay.appendChild(btn);
  });
  
  choiceOverlay.classList.add("active");
  
  // Keyboard support
  const handler = (e) => {
    const key = e.key.toUpperCase();
    const opt = choiceData.options.find(o => o.key === key);
    if(opt){
      document.removeEventListener("keydown", handler);
      navigateTo(opt.next);
    }
  };
  document.addEventListener("keydown", handler);
  // Store for cleanup
  choiceOverlay._keyHandler = handler;
}

// ==================== NAVIGATION ====================
function navigateTo(sceneId){
  if(choiceOverlay._keyHandler){
    document.removeEventListener("keydown", choiceOverlay._keyHandler);
    choiceOverlay._keyHandler = null;
  }
  const idx = scenes.findIndex(s => s.id === sceneId);
  if(idx >= 0){
    currentSceneIdx = idx;
    currentLineIdx = 0;
    updateProgress();
    renderScene(scenes[currentSceneIdx]);
  }
}

function advanceScene(){
  if(isTyping) return;
  if(choiceOverlay.classList.contains("active")) return; // Don't skip choices
  
  const scene = scenes[currentSceneIdx];
  // If scene has a direct next, go there
  if(scene.next){
    navigateTo(scene.next);
  } else if(currentSceneIdx < scenes.length - 1){
    currentSceneIdx++;
    currentLineIdx = 0;
    updateProgress();
    renderScene(scenes[currentSceneIdx]);
  }
}

// ==================== EVENT LISTENERS ====================
document.addEventListener("keydown", (e) => {
  if(e.code === "Space" || e.code === "ArrowRight"){
    e.preventDefault();
    if(!userHasInteracted){
      userHasInteracted = true;
      // Start
      renderScene(scenes[0]);
      updateProgress();
      return;
    }
    advanceScene();
  }
});

document.addEventListener("click", () => {
  if(!userHasInteracted){
    userHasInteracted = true;
    renderScene(scenes[0]);
    updateProgress();
    return;
  }
  advanceScene();
});

// ==================== INIT ====================
// Show initial title
placeholder.querySelector(".icon").textContent = "🎬";
placeholder.querySelector(".label").textContent = "生命守护者";
sceneLabel.textContent = "序幕 & 第一章";
navHint.style.display = "block";
progressBar.style.width = "0%";

console.log("《生命守护者》HTML 演示已就绪。点击或按空格键开始。");
console.log("总场景数：" + scenes.length);
</script>
